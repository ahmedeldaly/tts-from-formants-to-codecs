<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ahmed CTO</title>
<style>
  @font-face { font-family: Poppins; font-weight: 500; src: url(fonts/poppins-latin-500-normal.woff2); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(fonts/poppins-latin-700-normal.woff2); }

  html, body { margin: 0; padding: 0; background: #0b1630; overflow: hidden; }
  svg { display: block; font-family: Poppins, sans-serif; }

<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">

      <stop offset="0" stop-color="#0d1f45"/><stop offset="1" stop-color="#091329"/>

    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">

    </linearGradient>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#e2456b"/>

      <stop offset="0" stop-color="#eefbd9"/><stop offset="1" stop-color="#c9ef9f"/>

    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">

    <linearGradient id="bowlG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e6ee"/>
    </linearGradient>
    <pattern id="pinstripe" width="14" height="14" patternUnits="userSpaceOnUse">

      <line x1="7" y1="0" x2="7" y2="14" stroke="#2c3a5c" stroke-width="1.4" opacity="0.55"/>
    </pattern>
    <pattern id="tieStripe" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="24" height="24" fill="#c5d3ea"/>
      <rect y="0" width="24" height="5" fill="#4f6fb0"/>
      <rect y="9" width="24" height="3" fill="#8a93a6"/>
      <rect y="15" width="24" height="4" fill="#eef3fb"/>

    <clipPath id="faceClip">
      <path d="M190 250 C188 170 230 128 300 126 C370 128 412 170 410 250 C410 322 392 370 356 398 C336 413 318 420 300 420 C282 420 264 413 244 398 C208 370 190 322 190 250 Z"/>
    </clipPath>
    <clipPath id="mouthClip"><path id="mouthClipPath" d=""/></clipPath>

    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>

    <symbol id="heart" viewBox="-50 -45 100 90">
      <path d="M0 40 C-40 12 -50 -8 -44 -24 C-36 -44 -10 -44 0 -24 C10 -44 36 -44 44 -24 C50 -8 40 12 0 40 Z"/>

      <path d="M18 92 C40 92 40 60 60 60 C80 60 80 28 102 28" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
      <circle cx="18" cy="92" r="13" fill="currentColor"/>
      <circle cx="60" cy="60" r="13" fill="currentColor"/>
      <circle cx="102" cy="28" r="15" fill="#8bd346"/>
    </symbol>

  </g>
  <g id="bgS2">
    <rect width="1920" height="1080" fill="url(#bg2)"/>

    <circle cx="960" cy="560" r="330" fill="#1b4fa8" opacity="0.55"/>

    </g>
  </g>

    <path id="chartArrow" d="M-40 -26 L0 0 L-40 26" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

    <circle cx="960" cy="520" r="400" fill="#b4e67a" opacity="0.7"/>
    <circle id="s4ring" cx="960" cy="520" r="470" fill="none" stroke="#6fbf3a" stroke-width="5" stroke-dasharray="20 20" opacity="0.6"/>

  </g>

    <g id="dots5" opacity="0.18"></g>

    <circle id="s5ring" cx="1450" cy="520" r="430" fill="none" stroke="#8bd346" stroke-width="4" stroke-dasharray="18 22" opacity="0.6"/>

    </g>
    <g id="cloudCard" filter="url(#shadow)">
      <rect x="0" y="0" width="330" height="250" rx="26" fill="#ffffff"/>
      <path d="M85 165 C55 165 45 135 65 118 C60 90 95 75 115 92 C125 62 175 55 192 88 C225 80 250 110 238 135 C262 142 258 165 235 165 Z" fill="#dff3ff" stroke="#2f7de1" stroke-width="7" stroke-linejoin="round"/>

      <text id="kpi" x="332" y="50" text-anchor="end" font-size="26" font-weight="800" fill="#19c3a6">+0%</text>
      <g id="bars"></g>
    </g>
    <g id="gear">
      <path id="gearPath" d="" fill="#19c3a6" opacity="0.9"/>
      <circle r="22" fill="#10306b"/>
    </g>
  </g>
  <g id="propsS3">
    <g id="hearts3"></g>
  </g>

      <circle cx="316" cy="700" r="7" fill="#0e1426"/>

        <path d="M410 180 C398 260 390 340 335 420 L420 440 Z" fill="#b87a56" opacity="0.35"/>

      <path id="browR" d="M314 214 C332 208 355 210 370 222" fill="none" stroke="#1d1511" stroke-width="10" stroke-linecap="round"/>

          <path d="M246 262 C256 268 270 268 280 262" fill="none" stroke="#a86d4b" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <path id="eyeLClosed" d="M242 254 C252 244 272 244 282 254" fill="none" stroke="#2a1b14" stroke-width="4.5" stroke-linecap="round" opacity="0"/>

          <circle cx="338" cy="251" r="8.5" fill="#3b2416"/>

          <circle cx="341" cy="248" r="2.4" fill="#ffffff"/>

      <g id="mouthG">
        <path id="mouthFill" d="" fill="#6b2020"/>
        <g clip-path="url(#mouthClip)">
          <ellipse id="tongue" cx="300" cy="380" rx="26" ry="12" fill="#d1606a"/>

        <path d="M222 240 L194 244" stroke="#9aa4b0" stroke-width="4" stroke-linecap="round"/>
        <path d="M378 240 L406 244" stroke="#9aa4b0" stroke-width="4" stroke-linecap="round"/>
        <circle cx="221" cy="240" r="3.5" fill="#9aa4b0"/><circle cx="379" cy="240" r="3.5" fill="#9aa4b0"/>

      <path d="M130 700 C170 760 230 785 300 790" fill="none" stroke="#19c3a6" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

    </g>
    <g id="armR">
      <path id="armRPath" d="" fill="none" stroke="#0c1222" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="armRPath2" d="" fill="none" stroke="#1c2640" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="handR">
        <rect x="-26" y="-10" width="52" height="20" rx="6" fill="#f7f8fb"/>
        <circle r="27" cy="-24" fill="#d09470"/>
        <rect id="thumbR" x="-9" y="-78" width="18" height="40" rx="9" fill="#d09470" stroke="#a86d4b" stroke-width="2"/>

    <g id="t1role"><text x="170" y="660" font-size="50" font-weight="700" fill="#ffffff">Chief Technology Officer</text></g>
    <g id="t1co">

      <use href="#logoMark" x="188" y="712" width="60" height="60" color="#0d1f45"/>

  <g id="textS4">

    <g id="t4b"><text x="130" y="360" font-size="120" font-weight="800" fill="#1e4d12">Fresh</text></g>

// ---------- character rig ----------

    cx = 1150; cy = lerp(260, 180, up); cs = 1.05;
    $('s5circle').setAttribute('r', (360 * eBack(P(lt, 0, 0.55))).toFixed(1));
    $('s5ring').setAttribute('transform', `rotate(${t * 20} 1450 520)`);
    // wink at ~13.3s with his left eye (viewer's right)
    const wk = P(t, 13.25, 13.4) * (1 - P(t, 13.8, 13.95));
    eyeR = 1 - wk; eyeL = 1; happy = true;
    browLift = wk * 6;
    show('thumbR', true);
    const th = eBack(P(lt, 0.2, 0.6));
    aR = [lerp(490, 610, th), lerp(790, 400, th), 1];
    mouthOpen = 0.35; smile = 1;
    headRot = lerp(0, -6, eOut(P(t, 13.1, 13.4))) * (1 - P(t, 14.0, 14.4)) + Math.sin(t * 2) * 1.5;
    reveal('t5a', t, 12.55, 0.45, 60);
    reveal('t5b', t, 13.35, 0.45, 60);
    reveal('t5c', t, 13.5, 0.45, 60);
    reveal('t5logo', t, 13.9, 0.5, 40);
  }

  // apply character
  $('char').setAttribute('transform', `translate(${cx.toFixed(1)} ${(cy + breathe).toFixed(1)}) scale(${cs})`);
  $('head').setAttribute('transform', `translate(0 ${headDy.toFixed(1)}) rotate(${headRot.toFixed(2)} 300 400)`);
  $('browL').setAttribute('transform', `translate(0 ${(-browLift * 0.4).toFixed(1)})`);
  $('browR').setAttribute('transform', `translate(0 ${(-browLift).toFixed(1)})`);
  setMouth(mouthOpen, smile);
  setEye('L', eyeL, happy); setEye('R', eyeR, happy);
  setArm('L', aL[0], aL[1], aL[2]);
  const jr = setArm('R', aR[0], aR[1], aR[2], $('thumbR').getAttribute('display') === 'inline' ? 0 : undefined);

  // captions
  const cur = window.VO.find(v => t >= v.start - 0.1 && t <= v.end + 0.25);
  const cap = $('caption');
  if (cur) {
    const txt = $('capText'); if (txt.textContent !== cur.text) txt.textContent = cur.text;
    const w = txt.getComputedTextLength() + 80;
    $('capBg').setAttribute('x', (960 - w / 2).toFixed(1)); $('capBg').setAttribute('width', w.toFixed(1));
    const a = P(t, cur.start - 0.1, cur.start + 0.1) * (1 - P(t, cur.end + 0.05, cur.end + 0.25));
    cap.setAttribute('opacity', a.toFixed(2));
  } else cap.setAttribute('opacity', 0);

  // transition wipes around each boundary
  let wx = -4000;
  for (let i = 1; i < B.length - 1; i++) {
    const q = P(t, B[i] - 0.28, B[i] + 0.28);
    if (q > 0 && q < 1) wx = lerp(-3600, 2600, eInOut(q));
  }
  $('wipe1').setAttribute('x', (wx).toFixed(1));
  $('wipe2').setAttribute('x', (wx - 260).toFixed(1));
  // fade out at the very end
  document.getElementById('stage').style.opacity = 1 - P(t, 14.75, 15.0) * 0.0;
};
window.renderFrame(parseFloat(new URLSearchParams(location.search).get('t') || '1.6'));
</script>
